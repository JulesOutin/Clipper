[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Transforme des vidéos YouTube longues en clips de 2-5 minutes"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "deepgram-sdk>=3.0.0,<4.0.0",
    "anthropic>=0.34.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
clipper = "clipper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clipper*"]
